name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Continuous Integration (Linting & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Django Tests
        run: |
          python manage.py test --noinput
        env:
          SECRET_KEY: "temporary-secret-key-for-tests"
          DEBUG: "True"

  deploy:
    name: Continuous Deployment (Deploy to Server)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/driverbot
            git pull origin ${{ github.ref_name }}
            
            # Docker orqali qayta qurish va ishga tushirish
            docker-compose down
            docker-compose up --build -d
            
            # Migratsiyalarni bajarish va Webhookni sozlash
            docker-compose exec -T web python manage.py migrate
            docker-compose exec -T web python manage.py set_webhook
            
            echo "✅ Deployment successful! Webhook updated."
